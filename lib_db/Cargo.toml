[package]
name = "lib_db"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.93"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.38", features = ["serde"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
uuid = { version = "1.10", features = ["v4"] }
ingest_protocol = { path = "../../../../macos/ingest_bin/crates/ingest_protocol" }
ingest_models = { path = "../../../../macos/ingest_bin/crates/ingest_models" }
prost = "0.12"

[build-dependencies]
prost-build = "0.12"
protoc-bin-vendored = "3"
[dev-dependencies]
tempfile = "3.8"

[features]
examples = []
